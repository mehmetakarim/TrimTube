name: Regression

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  data-tests:
    name: Data and provider tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Windows media and editor integration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install opencv-contrib-python-headless numpy
      - run: npm run test:integration
      - name: Preserve reports and editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/media-qa/results.json
            build/studio-qa/results.json
            build/studio-qa/*.png
            build/voice-video-qa/results.json
